<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg">
  <main class="card">
      <div class="card-logo">
        <img class="card-logo-img" src="/images/logo.svg" alt="Fylo logo">
        <div class="icons">
          <img class="icon-img" src="/images/icon-document.svg" alt="document">
          <img class="icon-img" src="/images/icon-folder.svg" alt="folder">
          <img class="icon-img" src="/images/icon-upload.svg" alt="upload ">
        </div>
      </div>
      <div class="card-storage">
        <div class="storage-tooltip">
          <span class="tooltip-number">185</span>
          <span class="tooltip-text">GB LEFT</span>
        </div>
        <p class="card-storage-text">You've used<strong> 815 GB</strong> of your storage</p>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="storage-labels">
          <span>0 GB</span>
          <span>1000 GB</span>
        </div>
      </div>
  </main> 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/BaharKhezri">Bahar Khezri</a>.
  </footer>
</body>
</html>
